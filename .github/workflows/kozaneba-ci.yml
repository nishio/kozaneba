name: Kozaneba CI

on:
  # Every PR, including stacked ones (the iPad stack bases each PR on the
  # previous one, which kept CI from ever running on them).
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# The jobs only read the repository; do not hand npm scripts a write token.
permissions:
  contents: read

concurrency:
  group: kozaneba-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-build-preflight:
    name: Unit, build, and preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Cypress binary
        run: npx cypress verify

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Codex preflight
        run: npm run codex:preflight

  functions-build:
    name: Cloud Functions build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Keep in sync with functions/package.json engines.node (deploy runtime).
          node-version: 22
          cache: yarn
          cache-dependency-path: functions/yarn.lock

      - name: Install dependencies
        run: yarn --cwd functions install --frozen-lockfile

      - name: Build
        run: yarn --cwd functions build

      - name: Lint
        run: yarn --cwd functions lint

  cypress-emulator:
    name: Cypress with Firebase emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Firebase CLI and Cypress
        run: |
          npx firebase --version
          npx cypress verify

      - name: Firestore rules
        run: npm run test:rules

      - name: Firebase emulator smoke
        run: npm run cypress:emulator-smoke

      - name: Kozaneba Cypress suite
        run: npm run cypress:kozaneba-all

  ipad-webkit-smoke:
    name: iPad WebKit smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Playwright harness arrives with the iPad stack (#57); skip until a
      # branch has it.
      - name: Check for the Playwright harness
        id: harness
        run: |
          if [ -f playwright.config.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.harness.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.harness.outputs.present == 'true'
        run: npm ci --legacy-peer-deps

      - name: Install WebKit
        if: steps.harness.outputs.present == 'true'
        run: npx playwright install --with-deps webkit

      - name: iPad smoke
        if: steps.harness.outputs.present == 'true'
        run: |
          npx vite --port 3100 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://localhost:3100/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:3100/ >/dev/null || { cat vite.log; exit 1; }
          PW_BASE_URL=http://localhost:3100 npm run test:ipad
